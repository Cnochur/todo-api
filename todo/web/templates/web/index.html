<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <div>
        <h1>Dashboard</h1>
    </div>
    <div id="tasks">
        {% for task in tasks %}
        <div class="task">
            <h3>{{ task.title }}</h3>
            <p>{{ task.description }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
